<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}GT Scout{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
      --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --green: #00e5a0; --red: #ff6b6b; --yellow: #ffd700;
      --blue: #58a6ff; --purple: #bc8cff;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    /* NAV */
    nav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 1.5rem; position: sticky; top: 0; z-index: 100; }
    .nav-inner { display: flex; align-items: center; gap: 0; max-width: 1400px; margin: 0 auto; }
    .nav-brand { font-weight: 700; font-size: 1.1rem; color: var(--green); padding: 1rem 1.5rem 1rem 0; white-space: nowrap; text-decoration: none; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 0; }
    .nav-links a {
      display: block; padding: .75rem 1rem; color: var(--muted);
      text-decoration: none; font-size: .875rem; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); border-bottom-color: var(--green); }

    /* CONTAINER */
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    .page-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--text); }
    .section-title { font-size: 1rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .75rem; }

    /* CARD */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }

    /* TABLE */
    .tbl-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    thead th { background: var(--bg3); color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; padding: .6rem .75rem; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg3); }
    tbody td { padding: .55rem .75rem; color: var(--text); vertical-align: middle; }
    .tc { text-align: center; }

    /* BADGE */
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
    .badge-green { background: #1a7a4a22; color: #00ff88; border: 1px solid #1a7a4a; }
    .badge-red   { background: #8b1a1a22; color: #ff6b6b; border: 1px solid #8b1a1a; }
    .badge-yellow{ background: #7a6a0022; color: #ffd700; border: 1px solid #7a6a00; }
    .badge-blue  { background: #1d4e8922; color: #58a6ff; border: 1px solid #1d4e89; }
    .badge-gray  { background: #21262d;   color: var(--muted); border: 1px solid var(--border); }

    /* BTNS */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .9rem; border-radius: 6px; font-size: .85rem; font-weight: 500; border: 1px solid var(--border); cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; }
    .btn-green { background: #1a7a4a22; color: #00ff88; border-color: #1a7a4a; }
    .btn-green:hover { background: #1a7a4a44; }
    .btn-blue  { background: #1d4e8922; color: #58a6ff; border-color: #1d4e89; }
    .btn-blue:hover  { background: #1d4e8944; }
    .btn-gray  { background: var(--bg3); color: var(--muted); }
    .btn-gray:hover  { background: var(--border); color: var(--text); }

    /* SELECT / INPUT */
    select, input[type=text], input[type=search] {
      background: var(--bg3); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: .4rem .7rem; font-size: .875rem;
    }
    select:focus, input:focus { outline: none; border-color: var(--green); }

    /* PAGINATION */
    .pagination { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: 1rem; }
    .pagination a, .pagination span {
      padding: .35rem .7rem; border-radius: 6px; font-size: .85rem;
      border: 1px solid var(--border); text-decoration: none; color: var(--muted);
    }
    .pagination a:hover { border-color: var(--green); color: var(--green); }
    .pagination .current { background: var(--green); color: #000; border-color: var(--green); font-weight: 700; }

    /* UTILS */
    .flex { display: flex; } .gap-1 { gap: .5rem; } .gap-2 { gap: 1rem; }
    .items-center { align-items: center; } .justify-between { justify-content: space-between; }
    .mt-1 { margin-top: .5rem; } .mt-2 { margin-top: 1rem; } .mb-1 { margin-bottom: .5rem; } .mb-2 { margin-bottom: 1rem; }
    .text-green { color: var(--green); } .text-red { color: var(--red); } .text-yellow { color: var(--yellow); }
    .text-muted { color: var(--muted); } .text-sm { font-size: .85rem; }
    .w-full { width: 100%; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; }
    @media (max-width: 768px) { .grid-2,.grid-3,.grid-4 { grid-template-columns: 1fr; } }

    /* STAT BOX */
    .stat-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; }
    .stat-box .value { font-size: 2rem; font-weight: 700; color: var(--green); }
    .stat-box .label { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="/">🏆 GT Scout</a>
    <div class="nav-links">
      <a href="/"             class="{% if request.endpoint=='index'       %}active{% endif %}">Dashboard</a>
      <a href="/matches"      class="{% if request.endpoint=='matches'     %}active{% endif %}">Partidas</a>
      <a href="/scheduled"    class="{% if request.endpoint=='scheduled'   %}active{% endif %}">Agendadas</a>
      <a href="/statistics"   class="{% if request.endpoint=='statistics'  %}active{% endif %}">Estatísticas</a>
      <a href="/players"      class="{% if request.endpoint=='players'     %}active{% endif %}">Players</a>
      <a href="/head-to-head" class="{% if request.endpoint=='head_to_head'%}active{% endif %}">Confrontos</a>
      <a href="/charts"       class="{% if request.endpoint=='charts'      %}active{% endif %}">Gráficos</a>
      <a href="/reports"      class="{% if request.endpoint=='reports'     %}active{% endif %}">Relatórios</a>
    </div>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
